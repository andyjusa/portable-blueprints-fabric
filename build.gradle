plugins {
 id 'fabric-loom' version '1.10.5'
 id 'maven-publish'
 id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}
version = '2.0.10-fabric.1+1.21.1'
group = 'nimble.portable_blueprints'
base { archivesName = 'portable-blueprints' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.20.1'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1'
 modImplementation 'net.fabricmc:fabric-language-kotlin:1.14.2+kotlin.2.4.21'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.compilerArgs += ['-Xmaxerrs', '500'] }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }

kotlin { jvmToolchain(21) }
fabricApi { configureTests { createSourceSet = true; modId = "portable_blueprints_test"; enableGameTests = true; enableClientGameTests = false; eula = true } }

loom {
 runs {
  smokeClient {
   client()
   source sourceSets.gametest
   runDir 'build/client-smoke'
   vmArg '-Dportable_blueprints.smoke=true'
   vmArg "-Dportable_blueprints.smoke.dir=${layout.buildDirectory.dir('smoke-results').get().asFile.absolutePath}"
  }
 }
}

jar {
 from('LICENSE')
 from('PROVENANCE.md')
}
